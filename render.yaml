# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub/GitLab, then in Render choose
# "New +" -> "Blueprint" and select the repository. Render builds the
# Dockerfile at the repo root and runs it as a single web service:
# the Node backend serves the built frontend and Socket.IO on the same
# origin, and listens on the PORT environment variable Render injects.
services:
  - type: web
    name: twist-card-game
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is set automatically by Render — do not set it here.
      # SERVER_PATH is optional: set it only if you ever serve the game
      # under a sub-path instead of the domain root.
